[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oaknut-dfs"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "Python library for handling Acorn DFS disc images (SSD/DSD format)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "oaknut-file>=10.0",
    "oaknut-discimage>=10.0",
    "oaknut-filesystem>=10.0",
    "oaknut-basic>=10.0",
    "typename>=1.0.4",
]

# The `cli` extra pulls the shared CLI toolkit (which brings Click and
# asyoulikeit) so this package can contribute `disc dfs` subcommands. The
# library core never imports it, so a bare install stays CLI-free.
[project.optional-dependencies]
cli = ["oaknut-cli>=10.0"]

[project.urls]
Homepage = "https://github.com/rob-smallshire/oaknut/tree/master/packages/oaknut-dfs"
Documentation = "https://rob-smallshire.github.io/oaknut/disc/api/reference/dfs.html"
Repository = "https://github.com/rob-smallshire/oaknut"
Issues = "https://github.com/rob-smallshire/oaknut/issues"

# Filesystems contributed to the oaknut.filesystem axis — the unified
# extension contract (detection + operations). Discovered at runtime via
# entry points, so the detector ships with the format it detects.
[project.entry-points."oaknut.filesystem"]
acorn-dfs = "oaknut.dfs.filesystem:AcornDFS"
watford-dfs = "oaknut.dfs.filesystem:WatfordDFS"

# Admin subcommands contributed to the `disc` CLI on the oaknut.command
# axis: `disc dfs <subcommand>`. Loaded only with the [cli] extra.
[project.entry-points."oaknut.command"]
dfs = "oaknut.dfs.cli:dfs"

[tool.setuptools.dynamic]
version = { attr = "oaknut.dfs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
