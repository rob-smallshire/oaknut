[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oaknut-adfs"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "Acorn ADFS disc image support for Archimedes, RISC OS, and BBC Master"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "oaknut-file>=10.0",
    "oaknut-discimage>=10.0",
    "oaknut-identify>=10.0",
    "oaknut-filesystem>=10.0",
    "oaknut-basic>=10.0",
    "typename>=1.0.4",
]

# The `cli` extra pulls the shared CLI toolkit so this package can
# contribute `disc adfs` subcommands; the library core never imports it.
[project.optional-dependencies]
cli = ["oaknut-cli>=10.0"]

[project.urls]
Homepage = "https://github.com/rob-smallshire/oaknut/tree/master/packages/oaknut-adfs"
Documentation = "https://rob-smallshire.github.io/oaknut/disc/api/reference/adfs.html"
Repository = "https://github.com/rob-smallshire/oaknut"
Issues = "https://github.com/rob-smallshire/oaknut/issues"

# Probers contributed to the oaknut.identify cascade. (Legacy axis;
# retired in Phase C.)
[project.entry-points."oaknut.prober"]
adfs = "oaknut.adfs.probers:ADFSProber"

# Filesystem contributed to the oaknut.filesystem axis.
[project.entry-points."oaknut.filesystem"]
adfs = "oaknut.adfs.filesystem:ADFS"

# Admin subcommands contributed to the `disc` CLI: `disc adfs <subcommand>`.
[project.entry-points."oaknut.command"]
adfs = "oaknut.adfs.cli:adfs"

[dependency-groups]
test = [
    "pytest>=8.0",
]
dev = [
    "bump-my-version>=0.28.0",
    "pre-commit>=3.0",
    {include-group = "test"},
]

[tool.setuptools.dynamic]
version = { attr = "oaknut.adfs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
