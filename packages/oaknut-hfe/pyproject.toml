[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oaknut-hfe"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "Python library for reading HFE (HxC Floppy Emulator) flux-level disc images"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "oaknut-exception>=10.0",
    "oaknut-extension>=10.0",
    "oaknut-filesystem>=13.5",
]

# The `cli` extra pulls the shared CLI toolkit so this package can
# contribute `disc hfe` subcommands. The library core never imports it.
[project.optional-dependencies]
cli = ["oaknut-cli>=10.0", "oaknut-file>=10.0"]

[project.urls]
Homepage = "https://github.com/rob-smallshire/oaknut/tree/master/packages/oaknut-hfe"
Documentation = "https://rob-smallshire.github.io/oaknut/disc/api/reference/hfe.html"
Repository = "https://github.com/rob-smallshire/oaknut"
Issues = "https://github.com/rob-smallshire/oaknut/issues"

# The image decoder contributed to the oaknut.decoder axis: any `disc`
# command reading an image opens an HFE file as its flattened sectors.
[project.entry-points."oaknut.decoder"]
hfe = "oaknut.hfe.decoder:HFEDecoder"

# Subcommands contributed to the `disc` CLI on the oaknut.command axis:
# `disc hfe <subcommand>`. Loaded only with the [cli] extra.
[project.entry-points."oaknut.command"]
hfe = "oaknut.hfe.cli:hfe"

[tool.setuptools.dynamic]
version = { attr = "oaknut.hfe.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
