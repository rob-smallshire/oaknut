[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "oaknut-disc"
requires-python = ">= 3.11"
dynamic = ["version"]
description = "CLI for working with Acorn DFS, ADFS, and AFS disc images."
readme = "README.md"
license = "MIT"
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "oaknut-exception>=10.7",
    "oaknut-file>=10.0",
    "oaknut-dfs>=10.0",
    "oaknut-adfs>=10.0",
    "oaknut-afs>=10.0",
    "click>=8.1.7",
    "rich>=13.0",
    "asyoulikeit>=1.2.0",
    "exit-codes>=1.3",
]

[project.urls]
Homepage = "https://github.com/rob-smallshire/oaknut/tree/master/packages/oaknut-disc"
Documentation = "https://rob-smallshire.github.io/oaknut/disc/"
Repository = "https://github.com/rob-smallshire/oaknut"
Issues = "https://github.com/rob-smallshire/oaknut/issues"

[project.scripts]
disc = "oaknut.disc.cli:cli"
oaknut-disc = "oaknut.disc.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "oaknut.disc.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
