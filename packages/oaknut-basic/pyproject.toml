[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oaknut-basic"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "BBC BASIC tools: program tokeniser/de-tokeniser and PRINT#/INPUT# data-file reader/writer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# oaknut-exception uses except* (PEP 654), so requiring it raises this
# package's Python floor to 3.11.
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# This package ships the standalone `oaknut-basic` console script (see
# [project.scripts] below), and that script's module imports Click,
# asyoulikeit and oaknut.cli at load time. A console script is installed
# unconditionally, so those must be unconditional dependencies too —
# otherwise `pip install oaknut-basic` / `uvx oaknut-basic` yields an
# executable that dies with ModuleNotFoundError before it runs. The
# tokeniser and de-tokeniser also raise categorised errors from the
# shared oaknut-exception hierarchy so the CLI boundary can render them
# without a traceback.
dependencies = [
    "oaknut-exception>=10.0",
    "oaknut-codecs>=12.7",
    "click>=8.1.7",
    "asyoulikeit>=1.5.1",
    "oaknut-cli>=10.0",
]

[project.scripts]
oaknut-basic = "oaknut.basic.cli:cli"

[project.urls]
Homepage = "https://github.com/rob-smallshire/oaknut/tree/master/packages/oaknut-basic"
Repository = "https://github.com/rob-smallshire/oaknut"
Issues = "https://github.com/rob-smallshire/oaknut/issues"

[dependency-groups]
test = [
    "pytest>=8.0",
]
dev = [
    "bump-my-version>=0.28.0",
    "pre-commit>=3.0",
    {include-group = "test"},
]

[tool.setuptools.dynamic]
version = { attr = "oaknut.basic.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
