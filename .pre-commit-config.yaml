# Shared pre-commit configuration for the oaknut workspace.
# Runs ruff, ruff-format, and the PEP 420 namespace-init guard on
# every commit. Per-package pre-commit configs do not exist — this
# root configuration is authoritative.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: namespace-init-guard
        name: No src/oaknut/__init__.py in any package
        entry: scripts/check_no_namespace_init.sh
        language: system
        pass_filenames: false
        always_run: true
        description: |
          PEP 420 implicit namespace packages require that no package
          ships src/oaknut/__init__.py. Each package's code lives at
          src/oaknut/<name>/__init__.py instead.

      - id: readmes-fresh
        name: README.md and README-pypi.md are up to date
        entry: uv run python scripts/render_readme.py --check
        language: system
        pass_filenames: false
        files: ^(README\.md|README-pypi\.md|docs/README\.md\.j2|docs/README-pypi\.md\.j2|docs/readme_examples/.*\.py|scripts/render_readme\.py|packages/oaknut-[^/]+/pyproject\.toml)$
        description: |
          README.md is generated from docs/README.md.j2 plus the example
          scripts in docs/readme_examples/. README-pypi.md, the long
          description for the `oaknut` namespace placeholder distribution,
          is generated from docs/README-pypi.md.j2. Both are driven by
          each oaknut-* sub-package's pyproject.toml — if any of those
          change, regenerate with:
              uv run python scripts/render_readme.py
