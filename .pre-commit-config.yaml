# Shared pre-commit configuration for the oaknut workspace.
# Runs ruff, ruff-format, and the PEP 420 namespace-init guard on
# every commit. Per-package pre-commit configs do not exist — this
# root configuration is authoritative.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: namespace-init-guard
        name: No src/oaknut/__init__.py in any package
        entry: scripts/check_no_namespace_init.sh
        language: system
        pass_filenames: false
        always_run: true
        description: |
          PEP 420 implicit namespace packages require that no package
          ships src/oaknut/__init__.py. Each package's code lives at
          src/oaknut/<name>/__init__.py instead.

      - id: render-readmes
        name: Render the generated READMEs
        entry: uv run python scripts/render_readme.py
        language: system
        pass_filenames: false
        always_run: true
        description: |
          README.md is generated from scripts/readme-templates/README.md.j2
          plus the example scripts in scripts/readme-examples/. README-pypi.md,
          the long description for the `oaknut` namespace placeholder
          distribution, is generated from scripts/readme-templates/README-pypi.md.j2.
          Both are driven by each oaknut-* sub-package's pyproject.toml. A
          package README with code output or command transcripts is generated
          from packages/<package>/readme/README.md.j2 plus the examples in
          packages/<package>/readme/examples/. The examples execute against
          the workspace's own code, so the hook runs on every commit: a code
          change that alters an example's output regenerates the README, and
          pre-commit fails the commit so you re-stage. The renderer also
          accepts --check for CI.
