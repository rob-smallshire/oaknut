name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml

      - name: Install dependency environment (no workspace packages)
        # Sync all third-party dependencies into the venv but skip
        # the workspace members themselves. We'll install those from
        # freshly-built wheels below, so tests run against the
        # distribution artefacts rather than the editable source
        # tree. This is what catches wheel-packaging bugs (e.g.
        # missing package-data declarations, omitted resource files).
        run: uv sync --all-extras --no-install-workspace

      - name: Run namespace-init guard
        run: bash scripts/check_no_namespace_init.sh

      - name: Run ruff
        run: uv run --no-project ruff check

      - name: Build all workspace wheels
        run: uv build --all-packages

      - name: Install wheels into the test environment
        # Force bash so the glob expands consistently across all
        # three runner OSes (default pwsh on Windows doesn't expand
        # dist/*.whl the same way).
        shell: bash
        run: uv pip install dist/*.whl

      - name: Run tests against installed wheels
        # --no-project stops uv re-syncing the environment (which
        # would reinstate editable installs) so pytest imports the
        # code from the installed wheels.
        run: uv run --no-project pytest -v

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"

      - name: Install workspace + docs dependencies
        run: uv sync --group docs

      - name: Build all documentation bodies
        # Each docs/<body>/ that has a conf.py is an independent Sphinx
        # project, built into its own /<body>/ subpath of the combined
        # site so new bodies need no edit here. -W: warnings as errors —
        # the disc manual's cli-example directive also runs each
        # scripts/cli-examples/*.py recipe at this point, so a broken or
        # stale example fails the build.
        run: |
          for conf in docs/*/conf.py; do
            body="$(basename "$(dirname "$conf")")"
            echo "::group::Building $body"
            uv run sphinx-build -b html "docs/$body" "_site/$body" -W
            echo "::endgroup::"
          done
          cp docs/portal/index.html _site/index.html

      - name: Check public API documentation coverage
        # Fail if a package's public __all__ has symbols that no
        # reference page documents — the safety net for our hand-curated
        # autodoc. Gated per body; add the disc family's packages
        # (oaknut.file, oaknut.discimage, …) here as each
        # docs/disc/api/reference/*.rst stub is fleshed out.
        run: uv run python scripts/check_doc_coverage.py --inventory _site/zip/objects.inv oaknut.zip

      - name: Run Sphinx doctests
        # Any .. doctest:: blocks in a body are executed against the
        # real library here, independently of the HTML build above so a
        # doctest failure is reported with its own log.
        run: |
          for conf in docs/*/conf.py; do
            body="$(basename "$(dirname "$conf")")"
            echo "::group::Doctest $body"
            uv run sphinx-build -b doctest "docs/$body" "docs/$body/_build/doctest" -W
            echo "::endgroup::"
          done
