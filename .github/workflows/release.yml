name: Release

# Triggered by a version tag (v10.0.0, v10.0.1, etc.).
# Runs the full test suite and docs build first. Only if everything
# passes does it publish packages to PyPI and deploy docs to
# GitHub Pages.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml

      - name: Install workspace
        run: uv sync --all-extras

      - name: Run namespace-init guard
        run: bash scripts/check_no_namespace_init.sh

      - name: Run ruff
        run: uv run ruff check

      - name: Run tests
        run: uv run pytest -v

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"

      - name: Install workspace + docs dependencies
        run: uv sync --group docs

      - name: Run Sphinx doctests
        # Block release if any inline Python doctest in any body
        # disagrees with the installed library.
        run: |
          for conf in docs/*/conf.py; do
            body="$(basename "$(dirname "$conf")")"
            echo "::group::Doctest $body"
            uv run sphinx-build -b doctest "docs/$body" "docs/$body/_build/doctest" -W
            echo "::endgroup::"
          done

      - name: Build all documentation bodies
        # Each docs/<body>/ that has a conf.py is an independent Sphinx
        # project, built into its own /<body>/ subpath of the combined
        # site; the portal landing page sits at the root. -W: warnings
        # as errors — the disc manual's cli-example directive also runs
        # each scripts/cli-examples/*.py recipe here, so a broken or
        # stale example fails the build.
        run: |
          for conf in docs/*/conf.py; do
            body="$(basename "$(dirname "$conf")")"
            echo "::group::Building $body"
            uv run sphinx-build -b html "docs/$body" "_site/$body" -W
            echo "::endgroup::"
          done
          cp docs/portal/index.html _site/index.html

      - name: Check public API documentation coverage
        # Block release if a package's public __all__ has symbols that no
        # reference page documents — the safety net for our hand-curated
        # autodoc. Gated per body; add the disc family's packages
        # (oaknut.file, oaknut.discimage, …) here as each
        # docs/disc/api/reference/*.rst stub is fleshed out.
        run: uv run python scripts/check_doc_coverage.py --inventory _site/zip/objects.inv oaknut.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    name: Publish to PyPI
    needs: [test, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml

      - name: Install workspace
        run: uv sync

      - name: Build all packages
        run: |
          rm -rf dist/
          # --all-packages covers every workspace member plus the root
          # `oaknut` placeholder. The package list lives only in
          # [tool.uv.sources] / [tool.uv.workspace], not in CI.
          uv build --all-packages --out-dir dist/
          echo "=== Built artefacts ==="
          ls -la dist/

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/*

  deploy-docs:
    name: Deploy docs to GitHub Pages
    needs: [publish]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
