# oaknut — workspace root.
#
# This pyproject.toml serves two purposes:
#
# 1. It declares the uv workspace that stitches together the
#    packages/oaknut-* members into a single development environment.
#
# 2. It defines the bare `oaknut` distribution on PyPI, which is a
#    namespace placeholder: it ships no code and has no runtime
#    dependencies. Its only role is to own the `oaknut` name on PyPI
#    so the project that publishes the oaknut-* family of packages
#    also owns the unadorned namespace name. Functionality lives in
#    the oaknut-* siblings; users install only what they need.
#
# All packages in packages/ contribute to a single PEP 420 implicit
# namespace package (`oaknut`). No package ever ships
# src/oaknut/__init__.py — that is enforced by scripts/check_no_namespace_init.sh
# which runs both locally via pre-commit and in CI.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oaknut"
version = "12.2.0"
requires-python = ">=3.11"
description = "Namespace placeholder for the oaknut-* family of Acorn computer tools. Install oaknut-dfs, oaknut-adfs, oaknut-disc, etc. — not this."
readme = "README-pypi.md"
license = "MIT"
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
]
# The bare `oaknut` distribution is a namespace placeholder; it has
# no runtime dependencies. Each oaknut-* sibling is installed on its
# own merits via `pip install oaknut-<name>` or `uv add oaknut-<name>`.
dependencies = []

[project.urls]
Homepage = "https://github.com/rob-smallshire/oaknut"
Repository = "https://github.com/rob-smallshire/oaknut"
Issues = "https://github.com/rob-smallshire/oaknut/issues"

[tool.setuptools]
# The meta-distribution itself ships no code — only dependencies.
packages = []

[tool.uv.workspace]
members = ["packages/oaknut-*"]

[tool.uv.sources]
oaknut-exception = { workspace = true }
oaknut-file  = { workspace = true }
oaknut-extension = { workspace = true }
oaknut-discimage = { workspace = true }
oaknut-filesystem = { workspace = true }
oaknut-cli   = { workspace = true }
oaknut-basic = { workspace = true }
oaknut-dfs   = { workspace = true }
oaknut-adfs  = { workspace = true }
oaknut-afs   = { workspace = true }
oaknut-romfs = { workspace = true }
oaknut-zip   = { workspace = true }
oaknut-disc  = { workspace = true }

[tool.uv]
default-groups = ["test", "lint", "dev", "workspace"]

[dependency-groups]
# The `workspace` group exists purely to make `uv sync` install every
# oaknut-* sibling editable in dev. They were previously runtime deps
# of the `oaknut` placeholder distribution, which conflated "claim
# the PyPI name" with "install everything". Now the placeholder is
# truly empty, and dev installs happen via this group instead.
workspace = [
    "oaknut-exception",
    "oaknut-file",
    "oaknut-extension",
    "oaknut-discimage",
    "oaknut-filesystem",
    "oaknut-cli",
    "oaknut-basic",
    "oaknut-dfs",
    "oaknut-adfs",
    "oaknut-afs",
    "oaknut-romfs",
    "oaknut-zip",
    "oaknut-disc",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=5",
]
lint = [
    "ruff>=0.9",
]
dev = [
    "pre-commit>=3",
    "bump-my-version>=0.28",
    "jinja2>=3.1",
]
docs = [
    "sphinx>=8.0",
    "sphinx-clarity-theme>=2.1",
    "sphinx-click>=6.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]

[tool.bumpversion]
current_version = "12.2.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump oaknut to {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/oaknut-exception/src/oaknut/exception/__init__.py"

[[tool.bumpversion.files]]
filename = "packages/oaknut-file/src/oaknut/file/__init__.py"

[[tool.bumpversion.files]]
filename = "packages/oaknut-extension/src/oaknut/extension/__init__.py"

[[tool.bumpversion.files]]
filename = "packages/oaknut-discimage/src/oaknut/discimage/__init__.py"

[[tool.bumpversion.files]]
filename = "packages/oaknut-filesystem/src/oaknut/filesystem/__init__.py"

[[tool.bumpversion.files]]
filename = "packages/oaknut-cli/src/oaknut/cli/__init__.py"

[[tool.bumpversion.files]]
filename = "packages/oaknut-basic/src/oaknut/basic/__init__.py"

[[tool.bumpversion.files]]
filename = "packages/oaknut-dfs/src/oaknut/dfs/__init__.py"

[[tool.bumpversion.files]]
filename = "packages/oaknut-adfs/src/oaknut/adfs/__init__.py"

[[tool.bumpversion.files]]
filename = "packages/oaknut-afs/src/oaknut/afs/__init__.py"

[[tool.bumpversion.files]]
filename = "packages/oaknut-romfs/src/oaknut/romfs/__init__.py"

[[tool.bumpversion.files]]
filename = "packages/oaknut-zip/src/oaknut/zip/__init__.py"

[[tool.bumpversion.files]]
filename = "packages/oaknut-disc/src/oaknut/disc/__init__.py"

[tool.pytest.ini_options]
# importlib mode is required for PEP 420 namespace packages. The
# default prepend mode collides with sibling packages that contribute
# to the same namespace — they stop resolving each other.
minversion = "8.0"
addopts = ["--import-mode=importlib"]
testpaths = [
    "packages/oaknut-exception/tests",
    "packages/oaknut-file/tests",
    "packages/oaknut-extension/tests",
    "packages/oaknut-discimage/tests",
    "packages/oaknut-filesystem/tests",
    "packages/oaknut-cli/tests",
    "packages/oaknut-basic/tests",
    "packages/oaknut-dfs/tests",
    "packages/oaknut-adfs/tests",
    "packages/oaknut-afs/tests",
    "packages/oaknut-romfs/tests",
    "packages/oaknut-zip/tests",
    "packages/oaknut-disc/tests",
]
# The workspace-root tests/ directory holds shared test data and a
# tiny tests/fixtures.py module consumed by every package's conftest.
# It is intentionally *not* in testpaths — pytest should discover no
# test files there.
norecursedirs = ["tests/data"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
